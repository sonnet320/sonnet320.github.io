  <link rel="stylesheet" href="../assets/fonts.css">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <a class="skip" href="#tool">ファン・クーラーランキングへ進む</a>
  <header class="site-header">
    <a class="brand" href="../" aria-label="そねっとの趣味部屋 トップ">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg></span>
      <span id="site-name">そねっとの趣味部屋</span>
    </a>
    <nav aria-label="メインメニュー"><a href="../#sheet">PC構成シート</a><a href="../#recommendations">おすすめBTO</a><a href="../prices/">パーツ価格</a><a href="../ranking/" aria-current="page">ファン・クーラー</a></nav>
  </header>
  <main id="top" class="container">
    <section id="tool" aria-labelledby="page-title">
      <div class="section-heading sheet-heading">
        <div><p class="eyebrow">FANS & COOLERS</p><h1 id="page-title">ファン・クーラーランキング</h1><p class="lead">ケースファンは同じ騒音での風量、CPUクーラーは推定の冷却能力で比較。</p></div>
        <a class="text-link" href="../fan-ranking/" target="_blank" rel="noopener">シートだけで開く</a>
      </div>
      <div class="sheet-frame sub-frame">
        <iframe id="tool-frame" src="../fan-ranking/" title="ファン・クーラーランキング" allow="clipboard-write" loading="eager"></iframe>
      </div>
      <p class="sub-note">ファンを「構成に入れる」で選んで「PC構成シートで見る」を押すと、トップページのPC構成シートにファンが配置されます。</p>
    </section>
  </main>
  <footer class="site-footer"><span>© 2026 <span>そねっとの趣味部屋</span></span><div><a href="../pc-sheet/#about" target="_blank" rel="noopener">ご利用について</a><a href="#top">ページの上へ</a></div></footer>
  <script>
  /* the embedded sheet tells its height; 「PC構成シートで見る」 opens the top page with the parts / fans in its sheet */
  (()=>{const f=document.getElementById('tool-frame');
    addEventListener('message',e=>{
      if(e.origin!==location.origin||e.source!==f.contentWindow)return;
      const d=e.data;if(!d||d.channel!=='fan-ranking'||d.version!==1)return;
      if(d.type==='height'&&Number.isFinite(d.height)&&d.height>0)f.style.height=Math.min(20000,Math.ceil(d.height))+'px';
      if(d.type==='open-build'&&Array.isArray(d.parts)&&d.parts.every(x=>/^[a-z0-9-]{1,100}$/.test(x)))location.href='../?parts='+d.parts.join(',')+'#sheet';
    });
    f.addEventListener('load',()=>f.contentWindow.postMessage({channel:'fan-ranking',version:1,type:'request-height'},location.origin));
  })();
  </script>
</body>
</html>
